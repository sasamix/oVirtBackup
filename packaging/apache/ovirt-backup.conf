# oVirt Backup Console reverse proxy.
# Backend listens only on 127.0.0.1:8765.
# API calls are protected by /etc/ovirt-backup/web.token.

ProxyPass        /ovirt-backup/ http://127.0.0.1:8765/
ProxyPassReverse /ovirt-backup/ http://127.0.0.1:8765/

<Location /ovirt-backup/>
    Require all granted
</Location>
