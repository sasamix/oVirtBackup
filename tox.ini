[tox]
envlist = py39
skipsdist = True

[testenv]
deps =
    -r{toxinidir}/tests/requirements.txt
    -r{toxinidir}/requirements.txt
setenv =
    PYTHONPATH={toxinidir}
allowlist_externals = sh
commands =
    sh -c "pyflakes {toxinidir}/*.py {toxinidir}/web/*.py {toxinidir}/tests/*.py"
    python -m pytest --basetemp={envtmpdir} tests
