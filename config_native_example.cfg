[config]

# VM selection: use one method.
vm_names=["example-vm"]
vm_names_skip=[]
vm_tag=
all_vms=False

# Engine API.
server=https://engine.example.com/ovirt-engine/api
username=backup-user@internal
password=change-me

# Normal filesystem/NFS mount. Do NOT use the internal directory of an
# oVirt Export Domain.
backup_path=/mnt/ovirt-backup
backup_path_must_be_mount=True

# TLS.
ca_file=/etc/pki/ovirt-engine/ca.pem
verify_tls=True

# Full backup. False keeps crash-consistent behavior if guest freeze fails.
require_consistency=False

# Image transfer.
# Optional: force direct host ImageTransfer traffic over this oVirt logical
# network while keeping the original host FQDN for TLS verification. When set,
# proxy fallback is disabled so the transfer cannot silently fall back to a
# slower management path.
#
# For host-local NFS storage domains the script automatically matches
# storage.address to the UP oVirt host owning that IPv4 on this logical
# network, separately for every backup disk and for the restore target.
# Do not configure fixed download/upload hosts.
imageio_network=
imageio_max_workers=4
imageio_timeout=120
imageio_timeout_policy=cancel
imageio_progress_interval=10
imageio_progress_percent=5
backup_operation_timeout=3600

# Restore defaults. The restore command can override both.
cluster_name=Default
storage_domain=

# Retention.
backup_keep_count=3
backup_keep_count_by_number=3

# Disk selection.
bootable_only=False
with_disks_deactivated=False
disks_id_exclude=[]

# Destination free-space safety margin.
storage_space_threshold=0.1

# Logging.
logger_fmt=%(asctime)s: %(message)s
native_logger_file_path=/var/log/ovirt-backup/backup-native.log
native_restore_logger_file_path=/var/log/ovirt-backup/restore-native.log

# True = read-only preflight.
dry_run=True
